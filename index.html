    date: cat.date, containerOnly: cat.containerOnly || false, entries: {}, overrides: {},
    displayScale: cat.displayScale, bgColor: cat.bgColor,
    children: cat.children ? cat.children.map(cloneCategoryForDuplicate) : undefined
  };
}
async function swapSemestersDialog(){
  const cls = getActiveClass();
  if(!cls || cls.semesters.length < 2) return;
  const a = cls.semesters[0], b = cls.semesters[1];
  if(a.locked || b.locked){ await showAlert('Nicht möglich', 'Ein Halbjahr ist abgeschlossen. Bitte zuerst über Verwaltung → Halbjahr wieder öffnen.'); return; }
  const ok = await showConfirm('Halbjahre tauschen',
    `Der komplette Inhalt von ${a.name} und ${b.name} wird vertauscht (Noten, Spalten, Gewichtungen, Farben, Zeiträume, Schülerlisten). Tipp: vorher ein Backup erstellen. Über „Rückgängig“ lässt sich der Tausch zurücknehmen.`,
    {confirmLabel: 'Tauschen'});
  if(!ok) return;
  const keep = ['id', 'name'];
  const take = (s) => {
    const out = {};
    Object.keys(s).forEach(k => { if(!keep.includes(k)){ out[k] = s[k]; delete s[k]; } });
    return out;
  };
  const contentA = take(a), contentB = take(b);
  Object.assign(a, contentB);
  Object.assign(b, contentA);
  saveState(); render();
  setStatus(`${a.name} und ${b.name} getauscht`);
}
function cloneCategoryWithData(cat){
  const copy = JSON.parse(JSON.stringify(cat));
  const renew = (x) => { x.id = uid(); (x.children || []).forEach(renew); };
  renew(copy);
  delete copy.manualWeight;
  return copy;
}
async function moveOrCopyCategoryToOtherSemester(cls, sem, ctx){
  const target = cls.semesters.find(s => s.id !== sem.id);
  if(!target) return;
  if(target.locked){ await showAlert('Nicht möglich', `${target.name} ist abgeschlossen. Bitte zuerst über Verwaltung → Halbjahr wieder öffnen.`); return; }
  if(!target.groups.length){
    await showAlert('Nicht möglich', `${target.name} hat noch keine Notengruppe.`);
    return;
  }
  const mode = await showChoice(`„${ctx.cat.name}“ → ${target.name}`, 'Was soll mit der Spalte passieren?', [
    {label: 'Verschieben (Original wird entfernt)', value: 'move'},
    {label: 'Kopieren (Original bleibt)', value: 'copy'},
  ]);
  if(mode === null) return;
  const isCopy = mode === 'copy';
  const norm = (s) => (s || '').trim().toLowerCase();
  let tGroup = target.groups.find(g => norm(g.name) === norm(ctx.group.name));
  if(!tGroup){
    const pick = await showChoice('Zielgruppe wählen', `${target.name} hat keine Gruppe „${ctx.group.name}“. In welche Gruppe ${isCopy ? 'kopieren' : 'verschieben'}?`, target.groups.map(g => ({label: g.name, value: g.id})));
    if(pick === null) return;
    tGroup = target.groups.find(g => g.id === pick);
  }
  const ok = await showConfirm(isCopy ? 'In anderes Halbjahr kopieren' : 'In anderes Halbjahr verschieben',
    isCopy
      ? `„${ctx.cat.name}“ mit allen Noten von ${sem.name} nach ${target.name} (${tGroup.name}) kopieren? Das Original bleibt bestehen. Die Gewichtungen in ${target.name} werden neu ausgeglichen.`
      : `„${ctx.cat.name}“ mit allen Noten von ${sem.name} nach ${target.name} (${tGroup.name}) verschieben? Die Gewichtungen werden in beiden Halbjahren neu ausgeglichen.`,
    {confirmLabel: isCopy ? 'Kopieren' : 'Verschieben'});
  if(!ok) return;
  const srcList = ctx.list;
  let tList = tGroup.children;
  if(ctx.parentCat){
    const parentMatch = tGroup.children.find(x => isContainerCat(x) && norm(x.name) === norm(ctx.parentCat.name));
    if(parentMatch) tList = parentMatch.children;
  }
  let placed;
  if(isCopy){
    placed = cloneCategoryWithData(ctx.cat);
  } else {
    const idx = srcList.findIndex(x => x.id === ctx.cat.id);
    if(idx > -1) srcList.splice(idx, 1);
    delete ctx.cat.manualWeight;
    placed = ctx.cat;
  }
  tList.push(placed);
  // Schüler mit Einträgen müssen im Ziel-Halbjahr sichtbar sein
  const idsWithData = new Set();
  const collect = (x) => {
    Object.keys(x.entries || {}).forEach(id => idsWithData.add(id));
    Object.keys(x.overrides || {}).forEach(id => idsWithData.add(id));
    (x.children || []).forEach(collect);
  };
  collect(placed);
  let added = 0;
  if(target.studentIds){
    idsWithData.forEach(id => {
      if(cls.students.some(s => s.id === id) && !target.studentIds.includes(id)){ target.studentIds.push(id); added++; }
    });
  }
  if(!isCopy) rebalanceEqualWeights(srcList);
  rebalanceEqualWeights(tList);
  saveState(); render();
  setStatus(`„${ctx.cat.name}“ nach ${target.name} ${isCopy ? 'kopiert' : 'verschoben'}` + (added ? ` (${added} Schüler*in${added > 1 ? 'nen' : ''} dort ergänzt)` : ''));
}
async function openCategoryMenu(cls, sem, groupId, catId){
  const ctx = findCategoryContext(sem, groupId, catId);
  if(!ctx) return;
  const typeLabel = isContainerCat(ctx.cat) ? 'Sammelkategorie' : 'Leistungsdaten';
  let menuMessage = 'Was möchtest du tun?';
  if(ctx.cat.dateStart && ctx.cat.dateEnd){
    const active = isRangeActive(ctx.cat.dateStart, ctx.cat.dateEnd);
    menuMessage = `Quartal: ${formatDate(ctx.cat.dateStart)} – ${formatDate(ctx.cat.dateEnd)} (${active ? 'aktuell aktiv' : 'aktuell nicht aktiv'})\n${menuMessage}`;
  } else if(!isContainerCat(ctx.cat) && ctx.cat.date){
    menuMessage = `Datum: ${formatDate(ctx.cat.date)}\n${menuMessage}`;
  }
  const isSchriftlichLeaf = !isContainerCat(ctx.cat) && (ctx.group.name || '').trim().toLowerCase() === 'schriftlich';
  const otherSem = cls.semesters.length >= 2 ? cls.semesters.find(s => s.id !== sem.id) : null;
  const choice = await showChoice(ctx.cat.name, menuMessage, [
    {label: `${typeLabel} bearbeiten`, value: 'edit'},
    {label: `${typeLabel} duplizieren`, value: 'dup'},
    {label: `${typeLabel} löschen`, value: 'del'},
    ...(otherSem ? [{label: `⇄ In ${otherSem.name} verschieben / kopieren`, value: 'move'}] : []),
    ...(isSchriftlichLeaf ? [{label: '📊 Statistik', value: 'stats'}] : []),
  ]);
  if(choice === null) return;
  if(choice === 'edit'){
    editCategory(cls, sem, groupId, catId);
  } else if(choice === 'move'){
    await moveOrCopyCategoryToOtherSemester(cls, sem, ctx);
  } else if(choice === 'stats'){
    openKlausurStatistik(cls, sem, groupId, catId);
  } else if(choice === 'dup'){
    const countStr = await showPrompt('Duplizieren', 'Wie viele Duplikate erstellen?', '1', {inputType:'number', confirmLabel:'Erstellen'});
    if(countStr === null) return;
    const count = Math.max(1, Math.round(parseFloat(countStr)) || 1);
    const idx = ctx.list.findIndex(c=>c.id===catId);
    for(let i=0; i<count; i++){
      const copy = cloneCategoryForDuplicate(ctx.cat);
      ctx.list.splice(idx+1+i, 0, copy);
    }
    rebalanceEqualWeights(ctx.list);
    saveState(); render();
  } else if(choice === 'del'){
    const ok = await showConfirm(`${typeLabel} löschen`, typeLabel === 'Sammelkategorie' ? 'Diese Sammelkategorie inkl. aller Unterkategorien und Noten löschen?' : 'Diese Leistungsdaten inkl. aller Noten löschen?', {confirmLabel:'Löschen', danger:true});
    if(!ok) return;
    const idx = ctx.list.findIndex(c=>c.id===catId);
    if(idx > -1) ctx.list.splice(idx, 1);
    rebalanceEqualWeights(ctx.list);
    saveState(); render();
  }
}
async function convertCategoryMode(cls, cat, newMode){
  if(newMode === cat.mode) return;
  if(cat.mode === 'points' && newMode === 'grade'){
    const newEntries = {};
    cls.students.forEach(st => {
      const entry = cat.entries[st.id];
      if(!entry) return;
      const v = entryValue(cls, cat, entry);
      if(v === null || v === undefined || isNaN(v)) return;
      const gradeStr = cls.gradingSystem === 'punkte' ? String(Math.round(v)) : valueToGradeStr(v);
      newEntries[st.id] = {grade: gradeStr, note: entry.note};
    });
    cat.entries = newEntries;
    cat.mode = 'grade';
  } else if(cat.mode === 'grade' && newMode === 'points'){
    const ok = await showConfirm('Zu Klausurpunkten wechseln', 'Bereits eingetragene Noten lassen sich nicht in Klausurpunkte zurückrechnen und werden dabei gelöscht.', {confirmLabel:'Trotzdem wechseln', danger:true});
    if(!ok) return;
    cat.entries = {};
    cat.mode = 'points';
  } else if(cat.mode === 'observation' && newMode === 'grade'){
    const newEntries = {};
    cls.students.forEach(st => {
      const entry = cat.entries[st.id];
      if(entry && entry.hiddenGrade) newEntries[st.id] = {grade: entry.hiddenGrade, note: entry.note};
    });
    cat.entries = newEntries;
    cat.mode = 'grade';
  } else if((cat.mode === 'grade' || cat.mode === 'points') && newMode === 'observation'){
    const ok = await showConfirm('Zu Unterrichtsbeobachtung wechseln', 'Bestehende Einträge lassen sich nicht automatisch in Beobachtungssymbole umwandeln und werden dabei gelöscht.', {confirmLabel:'Trotzdem wechseln', danger:true});
    if(!ok) return;
    cat.entries = {};
    cat.mode = 'observation';
  } else if(cat.mode === 'observation' && newMode === 'points'){
    const ok = await showConfirm('Zu Klausurpunkten wechseln', 'Bestehende Beobachtungen lassen sich nicht in Klausurpunkte umwandeln und werden dabei gelöscht.', {confirmLabel:'Trotzdem wechseln', danger:true});
    if(!ok) return;
    cat.entries = {};
    cat.mode = 'points';
  } else {
    cat.mode = newMode;
  }
}
async function editCategory(cls, sem, groupId, catId){
  const ctx = findCategoryContext(sem, groupId, catId);
  if(!ctx) return;
  while(true){
    const ctx2 = findCategoryContext(sem, groupId, catId);
    if(!ctx2) return;
    const { group: g, cat } = ctx2;
    const isContainer = isContainerCat(cat);
    const modeLabel = cat.mode==='points' ? 'Klausurpunkte' : cat.mode==='observation' ? 'Beobachtung' : 'Note';
    const scaleLabel = cat.displayScale === 'noten' ? 'Noten' : cat.displayScale === 'punkte' ? 'Punkte' : 'wie Lerngruppe';
    const options = [
      ...(isContainer ? [] : [{label: `📅 Datum hinzufügen${cat.date ? ` (${formatDate(cat.date)})` : ''}`, value: 'date'}]),
      {label: `Gewichtung ändern${cat.manualWeight?' 🔒':''}`, value: 'weight'},
      {label: 'Name ändern', value: 'name'},
      {label: `Farbe ändern${cat.bgColor?' (eigene Farbe)':''}`, value: 'color'},
      ...(isContainer ? [] : [
        {label: `Eingabeart ändern (Leistungsdaten)`, value: 'mode'},
        ...(cat.mode==='points' ? [{label: `Maximalpunktzahl (${cat.maxPoints ?? 100})`, value: 'maxpoints'}] : []),
        ...(cat.mode!=='observation' ? [{label: `Darstellung ändern (Leistungsdaten)`, value: 'scale'}] : []),
      ]),
      {label: 'Fertig', value: 'done'},
    ];
    const choice = await showChoice(isContainer ? 'Sammelkategorie bearbeiten' : 'Leistungsdaten bearbeiten', cat.name, options);
    if(choice === null || choice === 'done') return;

    if(choice === 'date'){
      const dateStr = await showPrompt('Datum', 'Datum dieser Kategorie, leer lassen zum Entfernen', cat.date || '', {inputType:'date', confirmLabel:'Speichern'});
      if(dateStr !== null){ cat.date = dateStr; saveState(); render(); }
    } else if(choice === 'weight'){
      if(cat.manualWeight){
        const unlockChoice = await showChoice('Gewichtung', `Aktuell fixiert bei ${cat.weight}%`, [
          {label: 'Neuen Wert eingeben', value: 'set'},
          {label: '🔓 Fixierung aufheben', value: 'unlock'},
        ]);
        if(unlockChoice === null) continue;
        if(unlockChoice === 'unlock'){
          delete cat.manualWeight;
          rebalanceEqualWeights(ctx2.list);
          saveState(); render();
          continue;
        }
      }
      const otherManualSum = ctx2.list.filter(c => c.id !== cat.id && c.manualWeight && !c.ungraded).reduce((s,c)=>s+(c.weight||0),0);
      const maxAllowed = Math.max(0, 100 - otherManualSum);
      const weightStr = await showPrompt('Gewichtung', `Gewichtung in % (innerhalb von "${g.name}")${otherManualSum>0?` – maximal ${maxAllowed}% möglich (andere fixierte Spalten belegen bereits ${otherManualSum}%)`:''}`, cat.weight, {inputType:'number', confirmLabel:'Speichern'});
      if(weightStr !== null){
        const newWeight = parseFloat(weightStr) || 0;
        if(newWeight > maxAllowed){
          await showAlert('Wert nicht möglich', `Maximal ${maxAllowed}% möglich, da andere fixierte Spalten bereits ${otherManualSum}% belegen. Bitte einen kleineren Wert eingeben.`);
        } else {
          cat.weight = newWeight;
          cat.manualWeight = true;
          rebalanceEqualWeights(ctx2.list);
          saveState(); render();
        }
      }
    } else if(choice === 'name'){
      const name = await showPrompt('Name', 'Name der Kategorie', cat.name, {confirmLabel:'Speichern'});
      if(name !== null && name.trim()){ cat.name = name.trim(); saveState(); render(); }
    } else if(choice === 'color'){
      const colorSiblings = ctx2.list.filter(c => c.id !== cat.id && c.bgColor);
      const colorOptions = [
        {label: 'Standardfarbe (kein Hintergrund)', value: 'default'},
        {label: cat.bgColor ? 'Farbe ändern' : 'Eigene Farbe wählen', value: 'custom'},
      ];
      if(colorSiblings.length) colorOptions.push({label: 'Wie bei…', value: 'like'});
      const colorChoice = await showChoice('Hintergrundfarbe der Spalte', cat.bgColor ? 'Aktuell: eigene Farbe' : 'Aktuell: Standard', colorOptions);
      if(colorChoice === 'default') { cat.bgColor = undefined; delete cat.autoColored; saveState(); render(); }
      else if(colorChoice === 'custom'){
        const colorVal = await pickColorDialog('Farbe für diese Spalte wählen', cat.bgColor || '#cfe8fb');
        if(colorVal !== null){ cat.bgColor = colorVal; delete cat.autoColored; saveState(); render(); }
      } else if(colorChoice === 'like'){
        const likeChoice = await showChoice('Wie bei…', 'Farbe von welcher Kategorie übernehmen?', colorSiblings.map(c => ({label: c.name, value: c.bgColor})));
        if(likeChoice !== null){ cat.bgColor = likeChoice; delete cat.autoColored; saveState(); render(); }
      }
    } else if(choice === 'mode'){
      const currentModeLabel = cat.mode==='points' ? 'Klausurpunkte (automatisch berechnet)' : cat.mode==='observation' ? 'Unterrichtsbeobachtung (− ○ +)' : 'Note direkt eintragen';
      const modeChoice = await showChoice('Eingabeart', `Aktuell: ${currentModeLabel}`, [
        {label: 'Note direkt eintragen (mit Tendenz)', value: 'grade'},
        {label: 'Klausurpunkte (Note wird automatisch berechnet)', value: 'points'},
        {label: 'Unterrichtsbeobachtung (− ○ +)', value: 'observation'},
      ]);
      if(modeChoice !== null){ await convertCategoryMode(cls, cat, modeChoice); saveState(); render(); }
    } else if(choice === 'maxpoints'){
      const maxStr = await showPrompt('Maximalpunktzahl', 'Übliche maximale Punktzahl einer Klausur in dieser Kategorie', cat.maxPoints ?? 100, {inputType:'number', confirmLabel:'Speichern'});
      if(maxStr !== null){ cat.maxPoints = parseFloat(maxStr) || cat.maxPoints; saveState(); render(); }
    } else if(choice === 'scale'){
      const currentLabel = cls.gradingSystem === 'punkte' ? 'Notenpunkte' : 'Noten mit Tendenz';
      const scaleChoice = await showChoice('Darstellung (Leistungsdaten)', 'Unabhängig vom Notenschema der Lerngruppe wählbar.', [
        {label: `Wie Lerngruppe (aktuell: ${currentLabel})`, value: ''},
        {label: 'Noten mit Tendenz (1+ bis 6)', value: 'noten'},
        {label: 'Notenpunkte (0-15)', value: 'punkte'},
      ]);
      if(scaleChoice !== null){ cat.displayScale = scaleChoice || undefined; saveState(); render(); }
    }
  }
}

function renderKeepScroll(){

  render();

function cycleObservation(cls, ctx, el){
  const cat = ctx.cat, sid = el.dataset.student;
  const SEQ = ['', ...OBSERVATION_SYMBOLS];
  const e = {...(cat.entries[sid] || {})};
  if(entryMark(e)){ delete e.mark; delete e.x; }
  const next = SEQ[(SEQ.indexOf(e.observation || '') + 1) % SEQ.length];
  if(next){
    e.observation = next;
    cat.entries[sid] = e;
  } else {
    delete e.observation;
    if(Object.keys(e).some(k => e[k])) cat.entries[sid] = e; else delete cat.entries[sid];
  }
  saveState();
  const ov = cat.overrides && cat.overrides[sid];
  clearTimeout(obsRenderTimer);
  if(ov !== undefined && ov !== null && ov !== ''){
    renderKeepScroll();
    return;
  }
  // nur das angetippte Feld sofort ändern, Summen/Mehrheitssymbole kurz danach neu berechnen
  el.innerHTML = observationPill(cat.entries[sid]);
  obsRenderTimer = setTimeout(renderKeepScroll, 800);
}

function collectSelectableCategories(sem){
  const list = [];
  function walk(cat, group, pathLabel){
    const label = pathLabel ? `${pathLabel} → ${cat.name}` : `${group.name} → ${cat.name}`;
    list.push({id: cat.id, label});
    if(cat.children) cat.children.forEach(child => walk(child, group, label));
  }
  sem.groups.forEach(g => { g.children.forEach(cat => walk(cat, g, null)); });
  return list;
}
function collectObservationEntriesForStudent(sem, studentId){
  const results = [];
  function walk(cat, pathLabel){
    if(cat.mode === 'observation'){
      const entry = cat.entries[studentId];
      if(entry && entry.observation){
        results.push({label: pathLabel, symbol: entry.observation, note: entry.note || '', date: cat.date || ''});
      }
    }
    if(cat.children) cat.children.forEach(child => walk(child, `${pathLabel} → ${child.name}`));
  }
  sem.groups.forEach(g => { g.children.forEach(cat => walk(cat, `${g.name} → ${cat.name}`)); });
  return results;
}

    if(cat.id === catId){ found = cat; return; }

  }
  sem.groups.forEach(g => g.children.forEach(walk));

function punkteValueToNoteText(punkteVal){
  // PUNKTE_TABLE und NOTEN_TABLE haben identische Prozent-Schwellen an gleicher Stelle,
  // daher lässt sich ein Punktwert über den Index auf eine Buchstabennote zurückrechnen.
  const rounded = Math.round(punkteVal);
  let idx = PUNKTE_TABLE.findIndex(row => row.note === rounded);
  if(idx === -1){
    idx = PUNKTE_TABLE.reduce((bestIdx, row, i) => Math.abs(row.note-rounded) < Math.abs(PUNKTE_TABLE[bestIdx].note-rounded) ? i : bestIdx, 0);
  }
  return NOTEN_TABLE[idx].note;
}
function noteValueToPunkte(noteVal){
  const noteStr = valueToGradeStr(noteVal);
  const idx = NOTEN_TABLE.findIndex(row => row.note === noteStr);
  return idx > -1 ? PUNKTE_TABLE[idx].note : Math.round(15 - (noteVal-1)/5*15);
}
function convertValueScale(value, fromScale, toScale){
  if(value === null || value === undefined || isNaN(value) || fromScale === toScale) return value;
  if(fromScale === 'noten' && toScale === 'punkte') return noteValueToPunkte(value);
  if(fromScale === 'punkte' && toScale === 'noten') return gradeStrToValue(punkteValueToNoteText(value));
  return value;
}
function gradeTextForCategory(cls, cat, studentId){
  if(!cat) return '';
  const val = categoryAvgForStudent(cls, cat, studentId);
  if(val === null || val === undefined || isNaN(val)) return '';
  return cls.gradingSystem === 'punkte' ? punkteValueToNoteText(val) : valueToGradeStr(val);
}

}

async function exportNotennachweisJson(cls, sem, cfg){
  const students = getSemesterStudents(cls, sem);
  if(students.length === 0){
    await showAlert('Keine Schüler', 'In dieser Lerngruppe/diesem Halbjahr sind keine Schüler eingetragen.');
    return;
  }
  const catFor = (field) => cfg[field] ? findCatByIdInSemester(sem, cfg[field]) : null;
  const catKlE1 = catFor('klE1'), catKlE2 = catFor('klE2');
  const catSiK1 = catFor('siK1'), catSiK2 = catFor('siK2'), catSiK3 = catFor('siK3');
  const catSmE1 = catFor('smE1'), catSmE2 = catFor('smE2');
  const rows = students.map((st, idx) => ({
    nr: idx+1, name: st.name, kursart: '',
    klE1: gradeTextForCategory(cls, catKlE1, st.id), klE2: gradeTextForCategory(cls, catKlE2, st.id), klFlag: '',
    siK1: gradeTextForCategory(cls, catSiK1, st.id), siK2: gradeTextForCategory(cls, catSiK2, st.id), siK3: gradeTextForCategory(cls, catSiK3, st.id), siKlFlag: '',
    smE1: gradeTextForCategory(cls, catSmE1, st.id), smE2: gradeTextForCategory(cls, catSmE2, st.id), smFlag: '',
    ntFlag: '', fehlGes: '', fehlUe: ''
  }));
  const data = {
    meta: {
      stufe: '', kurs: cls.name, schuljahr: classYear(cls) || '', mode: cfg.mode,
      siK1Enabled: !!cfg.siK1, siK2Enabled: !!cfg.siK2, siK3Enabled: !!cfg.siK3,
    },
    rows
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = sanitizeForFilename(cls.name) + '_notennachweis.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus('Notennachweis-Datei erzeugt · ' + new Date().toLocaleTimeString('de-DE'));
}
function sanitizeForFilename(s){
  return String(s||'notenbuch').trim().replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'-');
}
function fmtStatNum(x, d){
  return (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d).replace('.', ',');
}
function buildSpiegelStats(vals, scale, total){
  // Notenspiegel: immer alle 16 Stufen von 1+ bis 6 (Notenpunkte 15 bis 0 entsprechen ihnen 1:1)
  const spiegel = NOTEN_TABLE.map((row, i) => ({label: row.note, points: PUNKTE_TABLE[i].note, count: 0}));
  vals.forEach(v => {
    let idx;
    if(scale === 'punkte'){
      const p = Math.max(0, Math.min(15, Math.round(v)));
      idx = PUNKTE_TABLE.findIndex(row => row.note === p);
    } else {
      const g = valueToGradeStr(v);
      idx = NOTEN_TABLE.findIndex(row => row.note === g);
    }
    if(idx > -1) spiegel[idx].count++;
  });
  const stats = {scale, total, n: vals.length, spiegel, mean: null, meanText: ''};
  if(vals.length){
    const mean = vals.reduce((s, v) => s + v, 0) / vals.length;
    stats.mean = mean;
    const valsNoten = vals.map(v => convertValueScale(v, scale, 'noten'));
    stats.meanNoten = valsNoten.reduce((s, v) => s + v, 0) / valsNoten.length;
    stats.meanText = scale === 'punkte'
      ? `${fmtStatNum(mean, 1)} Punkte (≈ ${punkteValueToNoteText(mean)})`
      : `${fmtStatNum(mean, 2)} (≈ ${valueToGradeStr(mean)})`;
  }
  return stats;
}
function computeKlausurStats(cls, sem, cat){
  const students = getSemesterStudents(cls, sem);
  const scale = cat.displayScale || cls.gradingSystem;
  const vals = [];
  students.forEach(s => {
    const v = categoryAvgForStudent(cls, cat, s.id);
    if(v === null || v === undefined || isNaN(v)) return;
    vals.push(convertValueScale(v, cls.gradingSystem, scale));
  });
  const stats = buildSpiegelStats(vals, scale, students.length);
  stats.ntAuto = students.filter(s => {
    const mk = studentMark(cat, s.id);
    if(mk === 'NT') return true;
    if(mk === 'NB') return false;
    const v = categoryAvgForStudent(cls, cat, s.id);
    return v === null || v === undefined || isNaN(v);
  }).length;
  return stats;
}
function statSpiegelChartHtml(st, forPrint){
  const maxCount = Math.max(...st.spiegel.map(b => b.count), 1);
  const barArea = forPrint ? 220 : 90;
  return st.spiegel.map(b => {
    const tone = b.label[0] <= '2' ? 'pass' : b.label[0] <= '4' ? 'warn' : 'danger';
    const fill = forPrint ? '#555' : `var(--${tone})`;
    return `<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
      <div style="font-size:${forPrint ? '11pt' : '0.68rem'};font-weight:600;">${b.count}</div>
      <div style="width:70%;height:${Math.round(b.count / maxCount * barArea)}px;min-height:${b.count ? 3 : 0}px;background:${fill};border-radius:2px 2px 0 0;"></div>
      <div style="font-size:${forPrint ? '10pt' : '0.62rem'};margin-top:3px;font-weight:600;">${b.label}</div>
      ${st.scale === 'punkte' ? `<div style="font-size:${forPrint ? '8pt' : '0.55rem'};color:#777;">${b.points}</div>` : ''}
    </div>`;
  }).join('');
}
function statSpiegelSvg(st){
  const W = 640, H = st.scale === 'punkte' ? 310 : 292, base = 250, maxH = 215, slot = W / st.spiegel.length, bw = 28;
  const maxCount = Math.max(...st.spiegel.map(b => b.count), 1);
  let g = '';
  st.spiegel.forEach((b, i) => {
    const h = Math.round(b.count / maxCount * maxH);
    const x = Math.round(i * slot + (slot - bw) / 2);
    const cx = Math.round(i * slot + slot / 2);
    if(h > 0) g += `<rect x="${x}" y="${base - h}" width="${bw}" height="${h}" fill="#555"/>`;
    g += `<text x="${cx}" y="${base - h - 7}" text-anchor="middle" font-size="16" font-weight="700" fill="#000">${b.count}</text>`;
    g += `<text x="${cx}" y="${base + 20}" text-anchor="middle" font-size="14" font-weight="700" fill="#000">${b.label}</text>`;
    if(st.scale === 'punkte') g += `<text x="${cx}" y="${base + 37}" text-anchor="middle" font-size="11" fill="#666">${b.points}</text>`;
  });
  g += `<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="#000" stroke-width="2"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" style="display:block;font-family:Arial,Helvetica,sans-serif;">${g}</svg>`;
}

const BORDERLINE_EPS = 0.05;
function computeBorderlineStatus(cls, value){
  if(value === null || value === undefined || isNaN(value)) return null;
  if(cls.gradingSystem === 'punkte'){
    const rounded = Math.round(value);
    if(Math.abs(value - rounded) < BORDERLINE_EPS) return {exact: true, text: String(rounded), rawValue: value};
    const floor = Math.floor(value), ceil = Math.ceil(value);
    const diffFloor = value - floor, diffCeil = ceil - value;
    const isTie = Math.abs(diffFloor - diffCeil) < BORDERLINE_EPS;
    const recommendation = isTie ? `${floor} ↑ / ${ceil} ↓` : (diffFloor < diffCeil ? `${floor} ↑` : `${ceil} ↓`);
    return {exact: false, isTie, floorText: String(floor), ceilText: String(ceil), recommendation, rawValue: value};
  }
  const steps = gradeValuesList(cls).map(v => ({text: v, val: gradeStrToValue(v)})).sort((a,b)=>a.val-b.val);
  const exactStep = steps.find(s => Math.abs(s.val - value) < BORDERLINE_EPS);
  if(exactStep) return {exact: true, text: exactStep.text, rawValue: value};
  let floor = null, ceil = null;
  for(const s of steps){
    if(s.val <= value) floor = s;
    if(s.val >= value && !ceil) ceil = s;
  }
  if(!floor || !ceil) return {exact: true, text: valueToGradeStr(value), rawValue: value};
  const diffFloor = value - floor.val, diffCeil = ceil.val - value;
  const isTie = Math.abs(diffFloor - diffCeil) < BORDERLINE_EPS;
  const recommendation = isTie ? `${floor.text} ↑ / ${ceil.text} ↓` : (diffFloor < diffCeil ? `${floor.text} ↑` : `${ceil.text} ↓`);
  return {exact: false, isTie, floorText: floor.text, ceilText: ceil.text, recommendation, rawValue: value};
}

  if(cat.mode === 'observation'){
    root.querySelectorAll('[data-obs-value]').forEach(btn=>{
      btn.onclick = () => {
        cat.entries[student.id] = {...(cat.entries[student.id]||{}), observation: btn.dataset.obsValue, note: currentNote()};
        saveState();
        renderModal(cls, cat, student);
      };
    });
    root.querySelectorAll('[data-hidden-grade-value]').forEach(btn=>{
      btn.onclick = () => {
        cat.entries[student.id] = {...(cat.entries[student.id]||{}), hiddenGrade: btn.dataset.hiddenGradeValue, note: currentNote()};
        saveState();
        renderModal(cls, cat, student);
      };
    });
  } else {
    root.querySelectorAll('[data-chip-value]').forEach(btn=>{
      btn.onclick = () => {
        const prevEntry = cat.entries[student.id];
        const keepFp = !!(prevEntry && prevEntry.fp && !entryMark(prevEntry));
        cat.entries[student.id] = {grade: btn.dataset.chipValue, note: currentNote(), ...(keepFp ? {fp: true} : {})};
        saveState();
        root.innerHTML = ''; render();
      };
    });
  }
  root.querySelectorAll('[data-mark-btn]').forEach(btn => {
    btn.onclick = () => {
      const mark = btn.dataset.markBtn;
      if(entryMark(cat.entries[student.id]) === mark){
        delete cat.entries[student.id];
      } else {
        cat.entries[student.id] = {mark, note: currentNote()};
      }
      saveState();
      root.innerHTML = ''; render();
    };
  });
  root.querySelectorAll('[data-fp-btn]').forEach(btn => {
    btn.onclick = () => {
      const prev = cat.entries[student.id];
      const e = entryMark(prev) ? {} : {...(prev || {})};
      if(e.fp) delete e.fp; else if(!(prev && prev.fp && !entryMark(prev))) e.fp = true;
      e.note = currentNote();
      if(e.fp || e.grade || (e.points !== undefined && e.points !== '') || e.note) cat.entries[student.id] = e;
      else delete cat.entries[student.id];
      saveState();
      renderModal(cls, cat, student);
    };
  });
  const noteInput = document.getElementById('entryNote');
  if(noteInput){
    noteInput.addEventListener('change', () => {
      if(cat.entries[student.id]) { cat.entries[student.id].note = noteInput.value; saveState(); }
    });
  }
  const clearBtn = document.getElementById('clearEntryBtn');
  if(clearBtn){
    clearBtn.onclick = async () => {
      const ok = await showConfirm('Eintrag löschen', 'Diesen Eintrag wirklich löschen?', {confirmLabel:'Löschen', danger:true});
      if(!ok) return;
      delete cat.entries[student.id]; saveState(); renderModal(cls, cat, student);
    };
  }
}

const SUBTLE_PALETTE = ['#D9EAD3','#FCE5CD','#CFE8FB','#F4CCCC','#E6D6F5','#FFF2CC','#D0E8E4','#F9D9E7','#DDEBF7','#EAE3D2'];
let colorizeAttempts = 0;
function comboColorsForNumber(n){
  const rot = n % SUBTLE_PALETTE.length;
  return [...SUBTLE_PALETTE.slice(rot), ...SUBTLE_PALETTE.slice(0, rot)];
}
function parentReferenceColorFor(sem, sel){
  if(sel.type === 'group'){
    const g = sem.groups.find(x => x.id === sel.id);
    return g ? (g.bgColor || colorForGroupName(g.name)) : null;
  }
  if(sel.type === 'studentcol') return null;
  const ctx = findCategoryContext(sem, sel.groupId, sel.id);
  if(!ctx) return null;
  if(ctx.parentCat && ctx.parentCat.bgColor) return ctx.parentCat.bgColor;
  const g = sem.groups.find(x => x.id === sel.groupId);
  return g ? (g.bgColor || colorForGroupName(g.name)) : null;
}
document.getElementById('colorizeSammelBtn').onclick = () => {
  if(!state.colorizeMode) return;
  const cls = getActiveClass();
  if(!cls) return;
  if(!state.colorizeSelection.length){
    setStatus('Bitte zuerst Notengruppen/Kategorien antippen, die gefärbt werden sollen.', true);
    return;
  }
  const sem = getActiveSemester(cls);
  colorizeAttempts++;
  const familyKeyFor = (sel) => {
    if(sel.type === 'group') return 'group:' + sel.id;
    if(sel.type === 'studentcol') return 'studentcol';
    const ctx = findCategoryContext(sem, sel.groupId, sel.id);
    if(ctx && ctx.parentCat) return 'parent:' + ctx.parentCat.id;
    return 'topgroup:' + sel.groupId;
  };
  const familyOrder = [];
  const familyMembers = {};
  state.colorizeSelection.forEach(sel => {
    const key = familyKeyFor(sel);
    if(!(key in familyMembers)){ familyMembers[key] = []; familyOrder.push(key); }
    familyMembers[key].push(sel);
  });
  const combo = comboColorsForNumber(colorizeAttempts);
  familyOrder.forEach((key, idx) => {
    const members = familyMembers[key];
    let color;
    if(colorizeAttempts === 1){
      const refColor = parentReferenceColorFor(sem, members[0]);
      color = refColor ? lightenColor(refColor, 0.35) : combo[idx % combo.length];
    } else {
      color = combo[idx % combo.length];
    }
    members.forEach(sel => {
      if(sel.type === 'group'){
        const g = sem.groups.find(x => x.id === sel.id);
        if(g) g.bgColor = color;
      } else if(sel.type === 'studentcol'){
        sem.studentColColor = color;
      } else {
        const ctx = findCategoryContext(sem, sel.groupId, sel.id);
        if(ctx) ctx.cat.bgColor = color;
      }
    });
  });
  saveState(); render();
};

async function performAppUpdate(){
  try{
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg) await reg.update();
    }
  }catch(e){}
  location.reload();
}
async function checkForAppUpdate(){
  setStatus('Prüfe auf Updates …');
  try{
    const res = await fetch(window.location.pathname + '?cachebust=' + Date.now(), {cache: 'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const match = text.match(/APP_VERSION_INFO\s*=\s*'([^']+)'/);
    if(!match){ await showAlert('Prüfung fehlgeschlagen', 'Version konnte in der Serverdatei nicht gefunden werden.'); return; }
    const remoteVersion = match[1];
    if(remoteVersion === APP_VERSION_INFO){
      await showAlert('Aktuell', `Du nutzt bereits die neueste Version.\n${APP_VERSION_INFO}`);
      return;
    }
    await offerAppUpdate(remoteVersion);
  }catch(e){
    await showAlert('Prüfung fehlgeschlagen', 'Es konnte keine Verbindung zum Server hergestellt werden. Internetverbindung erforderlich.');
  }
}
async function offerAppUpdate(remoteVersion){
  const choice = await showChoice('Update verfügbar', `Installiert: ${APP_VERSION_INFO}\nNeu: ${remoteVersion}\n\nEmpfehlung: Vor dem Update ein Backup erstellen.`, [
    {label: '⬇ Backup jetzt erstellen', value: 'backup'},
    {label: 'Update sofort ausführen', value: 'update'},
    {label: 'Später erinnern', value: 'later'},
  ]);
  if(choice === 'backup'){
    exportBackup();
    const proceed = await showConfirm('Update jetzt ausführen?', 'Backup wurde heruntergeladen. Soll das Update jetzt ausgeführt werden?', {confirmLabel:'Update ausführen'});
    if(proceed) await performAppUpdate();
  } else if(choice === 'update'){
    await performAppUpdate();
  }
}
async function autoCheckForUpdateSilently(){
  if(!navigator.onLine) return;
  try{
    const res = await fetch(window.location.pathname + '?cachebust=' + Date.now(), {cache: 'no-store'});
    if(!res.ok) return;
    const text = await res.text();
    const match = text.match(/APP_VERSION_INFO\s*=\s*'([^']+)'/);
    if(!match) return;
    const remoteVersion = match[1];
    if(remoteVersion === APP_VERSION_INFO) return; // already current, stay quiet
    await offerAppUpdate(remoteVersion);
  }catch(e){
    // offline or unreachable: stay silent, no interruption
  }
}

const DEMO_LAST_NAMES = ['Müller','Schmidt','Schneider','Fischer','Weber','Meyer','Wagner','Becker','Schulz','Hoffmann','Koch','Richter'];
function demoRandomFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function demoRandomGradeStr(){
  const base = Math.floor(Math.random()*6)+1;
  const tend = base===6 ? '' : demoRandomFrom(['+','','-']);
  return base + tend;
}
function demoRandomPoints(max){ return Math.round(Math.random()*max); }
function demoRandomObservation(){ return demoRandomFrom(['+','○','-']); }
function generateDemoStudents(count){
  const students = [];
  const usedNames = new Set();
  for(let i=0; i<count; i++){
    let name;
    do { name = `${demoRandomFrom(DEMO_LAST_NAMES)}, ${demoRandomFrom(DEMO_FIRST_NAMES)}`; } while(usedNames.has(name));
    usedNames.add(name);
    students.push({id: uid(), name});
  }
  return students;
}
function demoFillEntries(cat, studentIds){
  if(cat.children && cat.children.length){
    cat.children.forEach(child => demoFillEntries(child, studentIds));
    return;
  }
  if(!cat.mode) return; // pure Sammelkategorie without a mode yet
  studentIds.forEach(sid => {
    if(cat.mode === 'points'){
      cat.entries[sid] = {points: demoRandomPoints(cat.maxPoints||100), maxPoints: cat.maxPoints||100};
    } else if(cat.mode === 'observation'){
      const entry = {observation: demoRandomObservation()};
      if(!cat.ungraded) entry.hiddenGrade = demoRandomGradeStr();
      if(Math.random() < 0.3) entry.note = 'Demo-Notiz';
      cat.entries[sid] = entry;
    } else {
      cat.entries[sid] = {grade: demoRandomGradeStr()};
    }
  });
}

      onChange: (on) => {
        setBackupReminderEnabled(on);
        showToast(on ? 'Backup-Erinnerung eingeschaltet (nach 7 Tagen ohne Backup)' : 'Backup-Erinnerung ausgeschaltet');
        setStatus('Backup-Erinnerung ' + (on ? 'ein' : 'aus'));
      }}},
    {label: '⬆ Wiederherstellen', value: 'restore'},
    {heading: 'Export'},
    {label: 'Export für Excel', value: 'excel'},
    {label: 'Export für externe Tabelle (Zusatztool)', value: 'notennachweis'},
    {heading: 'Halbjahr und Schuljahr'},
    {label: '🗓 Zeiträume', value: 'zeitraeume'},
    ...(cls && sem ? [{label: sem.locked ? `🔓 Halbjahr wieder öffnen (${sem.name})` : `🔒 Halbjahr abschließen (${sem.name})`, value: 'lockhj'}] : []),
    ...(cls && cls.semesters.length >= 2 ? [{label: '⇄ Halbjahre tauschen', value: 'swaphj'}] : []),
    {label: '📅 Neues Schuljahr', value: 'newyear'},
    {label: `🗄 Archiv${archivedCount ? ' (' + archivedCount + ')' : ''}`, value: 'archive'},
    {heading: 'Sicherheit'},
    {label: '🔒 PIN-Sperre', value: 'pinlock'},
    {label: `⏱ Sperr-Zeit (${getIdleBlurSeconds()}s)`, value: 'idletime'},
    {heading: 'System'},
    {label: '🔄 Update prüfen', value: 'update'},
    {label: '🎲 Demomodus', value: 'demo'},
    {label: '⟲ Alles zurücksetzen', value: 'reset'},
  ];
  const choice = await showChoice('Verwaltung', '', options);
  if(choice === null) return;
  if(choice === 'update'){ await checkForAppUpdate(); }
  else if(choice === 'backup') exportBackup();
  else if(choice === 'restore') document.getElementById('importFile').click();
  else if(choice === 'reset') resetAllData();
  else if(choice === 'demo'){ await generateDemoClass(); }
  else if(choice === 'pinlock'){ await setupPinLock(); }
  else if(choice === 'swaphj'){ await swapSemestersDialog(); }
  else if(choice === 'lockhj'){ await toggleSemesterLock(cls, sem); }
  else if(choice === 'newyear'){ newSchoolYearDialog(); }
  else if(choice === 'archive'){ await openArchiveMenu(); }
  else if(choice === 'idletime'){ await setupIdleBlurTime(); }
  else if(choice === 'zeitraeume'){
    if(!cls){ await showAlert('Keine Lerngruppe', 'Bitte zuerst eine Lerngruppe auswählen.'); return; }
    openQuartaleModal(cls);
  }
  else if(choice === 'notennachweis'){
    if(!cls){ await showAlert('Keine Lerngruppe', 'Bitte zuerst eine Lerngruppe auswählen.'); return; }
    openNotennachweisModal(cls, sem);
  } else if(choice === 'excel'){
    if(!cls){ await showAlert('Keine Lerngruppe', 'Bitte zuerst eine Lerngruppe auswählen.'); return; }
    await runExcelExportFlow(cls, sem);
  }
};
function scaleTablesForPrint(){
  document.querySelectorAll('.grid-wrap').forEach(wrap => {
    wrap.style.transform = '';
    wrap.style.width = '';
    const table = wrap.querySelector('table.grid');
    if(!table) return;
    const naturalWidth = table.scrollWidth;
    const naturalHeight = table.scrollHeight;
    const targetPx = 718; // ~190mm nutzbare Breite bei A4 hochkant, 10mm Rand
    let outer = wrap.parentElement.classList.contains('print-scale-outer') ? wrap.parentElement : null;
    if(naturalWidth > targetPx){
      const scale = targetPx / naturalWidth;
      wrap.style.width = naturalWidth + 'px';
      wrap.style.maxWidth = 'none';
      wrap.style.transformOrigin = 'top left';
      wrap.style.transform = `scale(${scale})`;
      if(!outer){
        outer = document.createElement('div');
        outer.className = 'print-scale-outer';
        wrap.parentNode.insertBefore(outer, wrap);
        outer.appendChild(wrap);
      }
      outer.style.width = Math.ceil(naturalWidth * scale) + 'px';
      outer.style.height = Math.ceil(naturalHeight * scale) + 'px';
      outer.style.overflow = 'hidden';
    } else if(outer){
      outer.style.width = ''; outer.style.height = ''; outer.style.overflow = '';
    }
  });
}
function resetPrintScale(){
  document.querySelectorAll('.grid-wrap').forEach(wrap => {
    wrap.style.transform = '';
    wrap.style.width = '';
    wrap.style.maxWidth = '';
  });
  document.querySelectorAll('.print-scale-outer').forEach(outer => {
    const parent = outer.parentNode;
    while(outer.firstChild) parent.insertBefore(outer.firstChild, outer);
    parent.removeChild(outer);
  });
}
window.addEventListener('afterprint', resetPrintScale);
document.getElementById('printBtn').onclick = async () => {
  const cls = getActiveClass();
  if(!cls){ await showAlert('Keine Lerngruppe', 'Bitte zuerst eine Lerngruppe auswählen.'); return; }
  const sem = getActiveSemester(cls);
  const reportChoice = await showChoice('Drucken', 'Was möchtest du drucken?', [
    {label: 'Notenbuch (alles)', value: 'alles'},
    {label: 'Konferenztabelle (Schriftlich, Mündlich, Endnote)', value: 'konferenz'},
  ]);
  if(reportChoice === null) return;
  const methodChoice = await showChoice('Drucken', '', [
    {label: 'Direkt drucken', value: 'direct'},
    {label: 'Als PDF speichern', value: 'pdf'},
  ]);
  if(methodChoice === null) return;
  if(methodChoice === 'pdf'){
    await showAlert('Als PDF speichern', 'Im nächsten Fenster als Ziel/Drucker "Als PDF sichern" (bzw. "Auf iPad sichern" o.ä.) auswählen statt eines echten Druckers.');
  }
  if(reportChoice === 'konferenz'){
    try{
      printKonferenztabelleIsolated(cls, sem);
    }catch(err){
      await showAlert('Fehler', 'Konferenztabelle konnte nicht erzeugt werden: ' + err.message);
    }
    return;
  }
  const main = document.getElementById('main');
  main.insertAdjacentHTML('afterbegin', printHeaderHtml(cls, sem));
  scaleTablesForPrint();
  window.print();
  let restored = false;
  const restore = () => {
    if(restored) return;
    restored = true;
    render();
    resetPrintScale();
  };
  window.addEventListener('afterprint', restore, {once: true});
  setTimeout(restore, 1500);
};
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(file) importBackup(file);
  e.target.value = '';
});
document.getElementById('csvImportFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(file) importCSV(file);
  e.target.value = '';
});

document.getElementById('schoolYearInput').addEventListener('input', (e) => { state.schoolYear = e.target.value; saveState(); });

function syncStickyOffsets(){
  const titlebar = document.querySelector('.titlebar');
  const headerApp = document.querySelector('header.app');
  const toolbar = document.querySelector('.toolbar');
  if(!titlebar || !headerApp || !toolbar) return;
  const tbH = titlebar.offsetHeight;
  headerApp.style.top = tbH + 'px';
  const hH = headerApp.offsetHeight;
  toolbar.style.top = (tbH + hH) + 'px';
}
window.addEventListener('resize', syncStickyOffsets);
(async () => {
  await checkPinLockOnStart();
  setStatus('Wird geladen …');
  await loadState();
  document.getElementById('schoolYearInput').value = state.schoolYear;
  render();
  syncStickyOffsets();
  autoCheckForUpdateSilently();
  initIdleBlurWatcher();
  setTimeout(maybeShowBackupReminder, 1500);
})();
if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
